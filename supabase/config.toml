project_id = "your-project-ref"

[auth]
site_url = "https://template-portfolio-product.vercel.app"
additional_redirect_urls = [
  "https://template-portfolio-product.vercel.app/reset-password",
  "http://localhost:5173/reset-password",
]

[functions.create-checkout-session]
verify_jwt = true

[functions.create-customer-portal-session]
verify_jwt = true

[functions.redeem-access-code]
verify_jwt = true

# Stripe calls this endpoint directly and cannot present a Supabase JWT.
# Authenticity is instead verified via the Stripe-Signature header inside
# the function itself (see stripe-webhook/index.ts).
[functions.stripe-webhook]
verify_jwt = false
